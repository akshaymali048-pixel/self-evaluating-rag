[project]
name = "self-evaluating-rag"
version = "0.1.0"
description = "Self-evaluating RAG system with FastAPI, ChromaDB, Gemini, and RAGAS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.3",
    "python-multipart==0.0.20",
    "pydantic-settings==2.9.1",
    "sqlalchemy[asyncio]==2.0.41",
    "asyncpg==0.30.0",
    "alembic==1.16.2",
    "chromadb==0.6.3",
    "langchain==0.3.25",
    "langchain-core==0.3.65",
    "langchain-community==0.3.25",
    "langchain-text-splitters==0.3.8",
    "langchain-google-genai==2.1.4",
    "langchain-openai==0.3.22",
    "openai==1.82.1",
    "pypdf==5.6.0",
    "ragas==0.4.3",
    "datasets==4.0.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.0",
    "pytest-asyncio==0.26.0",
    "ruff==0.11.13",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: full pipeline tests (requires Postgres + OPENAI_API_KEY or GEMINI_API_KEY)",
]
